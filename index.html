<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0f14"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon.svg"><title>SECONDO</title><style>
:root{--bg:#0b0f14;--card:#141a22;--muted:#9aa6b2;--text:#f5f7fa;--accent:#6ee7ff;--green:#55d68a;--danger:#ff6b6b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}header{padding:22px 18px 12px;display:flex;justify-content:space-between;align-items:center}h1{margin:0;font-size:28px}main{padding:0 16px 92px}.hero{background:linear-gradient(145deg,#17212d,#10161e);border:1px solid #253241;border-radius:24px;padding:22px;margin:10px 0 16px}.status{color:var(--green);font-size:13px}.ask{width:100%;padding:20px;border:0;border-radius:18px;background:#e9faff;color:#071018;font-size:18px;font-weight:700;margin-top:14px}.card{background:var(--card);border:1px solid #222c38;border-radius:18px;padding:17px;margin:12px 0}.label{font-size:11px;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}.nav{position:fixed;bottom:0;left:0;right:0;background:#0e141b;border-top:1px solid #26313d;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 4px calc(7px + env(safe-area-inset-bottom));z-index:5}.nav button{background:none;border:0;color:#9da8b5;font-size:11px;padding:8px 2px}.nav button.active{color:var(--accent)}button{cursor:pointer}.row{display:flex;gap:8px;align-items:center}.small{color:var(--muted);font-size:14px;line-height:1.45}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#263545;color:#cfefff;font-size:12px;margin-top:8px}.danger{color:var(--danger)}input,textarea{width:100%;background:#0d131a;color:white;border:1px solid #2a3745;border-radius:12px;padding:13px;font:inherit}textarea{min-height:110px}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:end;z-index:10}.sheet{background:#121922;border-radius:22px 22px 0 0;padding:20px;width:100%;border-top:1px solid #304052}.sheet button{padding:13px;border-radius:12px;border:0;margin-top:10px;width:100%}.primary{background:#dff9ff;color:#071018}.secondary{background:#25313f;color:#fff}.list{margin-top:8px}.item{padding:14px 0;border-bottom:1px solid #25303b}.item:last-child{border-bottom:0}
</style></head><body><header><h1>SECONDO</h1><span class="status">● Connesso</span></header><main id="app"></main><nav class="nav" id="nav"></nav><div class="modal" id="modal"><div class="sheet"><h3>Parla con SECONDO</h3><textarea id="input" placeholder="Es. Domani alle 18 ho l'assemblea di condominio..."></textarea><button class="primary" onclick="processInput()">Elabora</button><button class="secondary" onclick="closeModal()">Annulla</button></div></div><script>
const tabs=[['⌂','Home'],['🧠','Memoria'],['🔗','Contesti'],['📅','Eventi'],['🔒','Privacy']];let tab='Home';
const get=(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d));const set=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
function init(){if(!localStorage.getItem('events'))set('events',[{title:'Assemblea di condominio',when:'Domani — 18:00',reminder:'17:50',confirmed:true}]);render()}
function nav(){document.getElementById('nav').innerHTML=tabs.map(([i,n])=>`<button class="${tab===n?'active':''}" onclick="tab='${n}';render()">${i}<br>${n}</button>`).join('')}
function render(){nav();let a=document.getElementById('app');if(tab==='Home')home(a);if(tab==='Memoria')memory(a);if(tab==='Contesti')contexts(a);if(tab==='Eventi')events(a);if(tab==='Privacy')privacy(a)}
function home(a){let ev=get('events',[])[0];a.innerHTML=`<section class="hero"><div class="label">ASSISTENTE PERSONALE</div><div style="font-size:22px;font-weight:700">Come posso aiutarti?</div><button class="ask" onclick="listenOrOpen()">🎙️ Parla con SECONDO</button></section><section class="card"><div class="label">PROSSIMO EVENTO</div><b>${ev?ev.title:'Nessun evento'}</b><div class="small">${ev?ev.when:''}</div>${ev?`<span class="pill">🔔 Promemoria ${ev.reminder}</span>`:''}</section><section class="card"><div class="label">PROVA</div><div class="small">“Domani alle 18 ho l'assemblea di condominio.”<br><br>SECONDO conserva l'informazione e la collega al contesto.</div></section>`}
function memory(a){let m=get('memories',[]);a.innerHTML=`<section class="card"><div class="label">MEMORIA</div><h2>🧠 Cosa ricorda SECONDO</h2>${m.length?'<div class="list">'+m.map((x,i)=>`<div class="item">${esc(x.text)}<div class="small">Fonte: input utente · ${x.date}</div><button class="secondary" onclick="forget(${i})">🗑️ Dimentica</button></div>`).join('')+'</div>':'<div class="small">Nessuna memoria ancora. Prova a parlare con SECONDO.</div>'}</section>`}
function contexts(a){a.innerHTML=`<section class="card"><div class="label">CONTESTI</div><h2>🔗 Memoria collegata</h2><div class="small">Qui appariranno i collegamenti tra persone, eventi, documenti e informazioni.</div><div class="card"><b>Assemblea di condominio</b><div class="small">Evento · Domani 18:00<br>Promemoria · 17:50</div><span class="pill">Contesto attivo</span></div></section>`}
function events(a){let e=get('events',[]);a.innerHTML=`<section class="card"><div class="label">EVENTI</div><h2>📅 I tuoi eventi</h2>${e.map((x,i)=>`<div class="item"><b>${esc(x.title)}</b><div class="small">${esc(x.when)} · 🔔 ${esc(x.reminder)}</div><span class="pill">${x.confirmed?'Confermato':'Da verificare'}</span></div>`).join('')}</section><section class="card"><button class="ask" style="margin:0" onclick="openModal()">＋ Nuovo evento / memoria</button></section>`}
function privacy(a){a.innerHTML=`<section class="card"><div class="label">PRIVACY</div><h2>🔒 Il controllo è tuo</h2><div class="item">🎙️ Microfono <span class="small">Usato solo quando attivi l'ascolto.</span></div><div class="item">📍 Posizione <span class="small">Disattivata nella V0.</span></div><div class="item">☁️ Cloud <span class="small">Nessun cloud nella V0.</span></div><div class="item">🧠 Memoria <span class="small">Salvata localmente sul dispositivo.</span></div><button class="secondary" onclick="if(confirm('Cancellare tutte le memorie?')){localStorage.removeItem('memories');render()}">Cancella tutte le memorie</button></section>`}
function openModal(){document.getElementById('modal').style.display='flex';document.getElementById('input').focus()}function closeModal(){document.getElementById('modal').style.display='none'}
function processInput(){let t=document.getElementById('input').value.trim();if(!t)return;let m=get('memories',[]);m.unshift({text:t,date:new Date().toLocaleString('it-IT')});set('memories',m);let low=t.toLowerCase();if(low.includes('assemblea')&&low.includes('18')){let e=get('events',[]);e[0]={title:'Assemblea di condominio',when:'Domani — 18:00',reminder:'17:50',confirmed:true};set('events',e)}closeModal();tab='Memoria';render()}
function forget(i){let m=get('memories',[]);m.splice(i,1);set('memories',m);render()}
function esc(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function listenOrOpen(){if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){openModal();return}let R=window.SpeechRecognition||window.webkitSpeechRecognition;let r=new R();r.lang='it-IT';r.onresult=e=>{document.getElementById('input').value=e.results[0][0].transcript;processInput()};r.onerror=()=>openModal();r.start()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');init();
</script></body></html>
